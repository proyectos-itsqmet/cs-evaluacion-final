{% extends "base.html" %}
{% load bootstrap5 %}
{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-start">
        <h1 class="h3 mb-4 text-center">Formulario de Telefono</h1>
        <form method="post">
          {% csrf_token %}
          {% bootstrap_form form %}
          {% buttons submit='Grabar' %}
          {% endbuttons %}
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
